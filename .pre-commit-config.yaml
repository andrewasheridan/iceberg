default_language_version:
  python: python3.14

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:

      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  # Same pattern as tests/unit/test_comment_style.py; keep them in sync.
  - repo: local
    hooks:
      - id: no-banner-comments
        name: no banner comments
        language: pygrep
        entry: '^\s*#\s*[-=]{10,}\s*$'
        types_or: [python, pyi, toml, yaml, shell]
