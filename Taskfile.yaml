version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install all dependencies
    cmds:
      - uv sync

  lint:
    desc: Run ruff linter and autofix issues
    cmds:
      - uv run ruff check --fix .

  lock:check:
    desc: Fail if uv.lock is out of date with pyproject.toml
    cmds:
      - uv lock --check

  lint:check:
    desc: Run ruff linter (check only, no fixes)
    cmds:
      - uv run ruff check .

  format:
    desc: Run ruff formatter
    cmds:
      - uv run ruff format .

  format:check:
    desc: Check formatting without writing
    cmds:
      - uv run ruff format --check .

  typecheck:
    desc: Run pyrefly type checking
    cmds:
      - uv run pyrefly check

  test:
    desc: Run pytest with coverage
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  iceberg:
    desc: Run iceberg on itself (dogfood — show public API)
    cmds:
      - uv run iceberg src/ {{.CLI_ARGS}}

  bench:
    desc: Measure the analysis time (standard library by default; --generate N for a large tree)
    cmds:
      - uv run python scripts/benchmark.py {{.CLI_ARGS}}

  mutate:
    desc: Run mutation testing with mutmut (give a pattern to select functions)
    cmds:
      - uv run --group mutation mutmut run {{.CLI_ARGS}}

  mutate:results:
    desc: List the mutants that survived the last mutmut run
    cmds:
      - uv run --group mutation mutmut results

  mutate:browse:
    desc: Open the mutmut terminal UI to examine the mutants
    cmds:
      - uv run --group mutation mutmut browse

  mutate:clean:
    desc: Delete the mutmut results (mutants/)
    cmds:
      - rm -rf mutants/

  api:update:
    desc: Write the public API snapshot (api.txt) from src/sheridan/
    cmds:
      - uv run iceberg src/sheridan/ > api.txt

  api:check:
    desc: Fail if the public API differs from the committed snapshot (api.txt)
    cmds:
      - |
        uv run iceberg src/sheridan/ | diff -u --label api.txt --label "iceberg src/sheridan/" api.txt - || {
          echo "The public API changed. If that is intended, run: task api:update" >&2
          exit 1
        }

  security:check:
    desc: Run bandit security linter on src/
    cmds:
      - uv run bandit -r src/

  sdist:check:
    desc: Fail if the sdist has a top-level entry other than the files it should ship
    cmds:
      - |
        dist="$(mktemp -d)"
        trap 'rm -rf "$dist"' EXIT
        uv build --sdist --out-dir "$dist" --quiet
        unexpected="$(tar -tzf "$dist"/*.tar.gz | cut -d/ -f2 | grep -v '^$' | sort -u \
          | grep -vxF -e .gitignore -e CHANGELOG.md -e LICENSE -e PKG-INFO -e README.md \
            -e pyproject.toml -e src -e tests || true)"
        if [ -n "$unexpected" ]; then
          printf 'The sdist has unexpected top-level entries:\n%s\n' "$unexpected" >&2
          echo "Check [tool.hatch.build.targets.sdist] in pyproject.toml." >&2
          exit 1
        fi

  check:
    desc: Run all gates (lock:check, lint:check, format:check, typecheck, test, api:check, sdist:check)
    cmds:
      - task: lock:check
      - task: lint:check
      - task: format:check
      - task: typecheck
      - task: test
      - task: api:check
      - task: sdist:check

  docs:build:
    desc: Build Zensical documentation
    cmds:
      - uv run zensical build

  docs:serve:
    desc: Serve Zensical documentation locally
    cmds:
      - uv run zensical serve

  changelog:
    desc: Generate/update CHANGELOG.md from conventional commits
    cmds:
      - uv run cz changelog {{.CLI_ARGS}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist/ .coverage htmlcov/ .ruff_cache/ __pycache__/
      - find . -type d -name __pycache__ -exec rm -rf {} +
      - find . -type f -name "*.pyc" -delete
