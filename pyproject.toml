[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "sheridan-iceberg"
version = "7.0.0"
description = "Reports the public API surface of Python modules"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [{ name = "sheridan", email = "andrewasheridan@gmail.com" }]
keywords = ["static-analysis", "api", "all", "linting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/andrewasheridan/iceberg"
Issues = "https://github.com/andrewasheridan/iceberg/issues"
Changelog = "https://github.com/andrewasheridan/iceberg/blob/main/CHANGELOG.md"

[project.scripts]
iceberg = "sheridan.iceberg._cli:main"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sheridan"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
src = ["src"]
line-length = 120
exclude = [".claude/worktrees"]

[tool.ruff.lint]
select = [
    "D",   # pydocstyle errors
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = []
extend-select = [
    "D400",
    "D401",
    "D404",
    "D406",
]

[tool.ruff.lint.per-file-ignores]
# Ignore `D` errors in tests dir
"**/tests/**" = ["D"]
"test_*.py" = ["D"]
"**/examples/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["sheridan"]

[tool.ruff.lint.pydocstyle]
convention = "google"
# The google convention turns off D203, D204, D213, D215, D400, D401, D404, D406,
# D407, D408, D409, and D413. `extend-select` above turns D400, D401, D404, and
# D406 back on. D401 lets "Return" through (it is imperative), so
# tests/unit/test_docstring_style.py rejects docstrings that start with it.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
project-includes = ["src", "tests"]
# Fixture packages are inputs that iceberg parses, not code that runs or is imported;
# their relative imports only resolve when the fixture directory is the search root.
project-excludes = ["tests/fixtures"]
search-path = ["src"]
python-version = "3.14.0"
preset = "strict"
check-unannotated-defs = true
infer-return-types = "never"

[tool.pyrefly.errors]
implicit-any = "error"
no-any-return = "error"
method-assign = "error"
unannotated-return = "error"
implicit-any-parameter = "error"
redundant-cast = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage settings (source, threshold, missing lines) live in [tool.coverage.*].
addopts = "--cov"

[tool.coverage.run]
source = ["src/sheridan/iceberg"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.commitizen]
name = "cz_conventional_commits"
version = "7.0.0"
version_files = [
    "pyproject.toml:^version",
]
tag_format = "v$version"
# uv.lock records the project version, so refresh it and add it to the bump commit.
pre_bump_hooks = [
    "uv lock",
    "git add uv.lock",
]
update_changelog_on_bump = true

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "commitizen>=4.13.10",
    "mkdocstrings[python]>=1.0.3",
    "prek>=0.5.10",
    "pyrefly>=1.4.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
    "zensical>=0.0.32",
]
