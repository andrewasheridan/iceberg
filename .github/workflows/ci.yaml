name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: All gates
    runs-on: ubuntu-latest
    if: |
      !startsWith(github.event.head_commit.message, 'bump:') &&
      !startsWith(github.head_ref, 'chore/version-bump-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
        with:
          version: 3.x

      - name: Sync the environment from uv.lock
        id: sync
        run: uv sync --locked

      # Each gate runs after a failed gate too, so that one run shows all the failures.
      - name: lock
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: task lock:check
      - name: lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: task lint:check
      - name: format
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: task format:check
      - name: typecheck
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: task typecheck
      - name: test
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: task test
      - name: security
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: task security:check
      - name: docs
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: task docs:build
      - name: api
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: task api:check
      - name: sdist
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: task sdist:check

  next-python:
    # The newest Python that iceberg supports. Some dev tools have no wheels for it yet,
    # so this job syncs only the "test" dependency group.
    name: Tests (Python 3.15)
    runs-on: ubuntu-latest
    if: |
      !startsWith(github.event.head_commit.message, 'bump:') &&
      !startsWith(github.head_ref, 'chore/version-bump-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked --python 3.15 --no-default-groups --group test
      - run: uv run --no-sync pytest

  tests:
    # The "All gates" job runs only on Linux. This job runs the tests on each operating
    # system, because path handling and console encoding differ.
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: |
      !startsWith(github.event.head_commit.message, 'bump:') &&
      !startsWith(github.head_ref, 'chore/version-bump-')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - run: uv sync --locked
      - run: uv run pytest
