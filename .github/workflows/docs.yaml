name: Documentation
# PRs build the docs in the Dagger `check` gate (ci.yaml), so this workflow only deploys.
# It deploys on pushes to main that can change the site. pyproject.toml covers version
# bumps, so each release redeploys. Release tags are left out on purpose: the
# github-pages environment only accepts deployments from main.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "README.md"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yaml"
concurrency:
  group: "pages"
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: cp README.md docs/index.md
      - run: uv run zensical build --clean
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
