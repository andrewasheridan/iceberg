name: Update changelog

on:
  workflow_dispatch:

jobs:
  changelog:
    name: Regenerate CHANGELOG.md
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Regenerate CHANGELOG.md
        run: uv run cz changelog

      - name: Open PR if changelog changed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog updates needed."
          else
            BRANCH="chore/changelog-update-${{ github.run_number }}"
            git checkout -b "$BRANCH"
            git add CHANGELOG.md
            git commit -m "chore: update CHANGELOG.md"
            git push origin "$BRANCH"
            gh pr create \
              --title "chore: update CHANGELOG.md" \
              --body "Automated CHANGELOG.md regeneration triggered via workflow dispatch." \
              --base main \
              --head "$BRANCH"
            gh pr edit "$BRANCH" --add-label automated || true
          fi
